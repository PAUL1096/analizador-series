# ─────────────────────────────────────────────────────────────────────────────
# Nombres legibles y unidades de variables que NO tienen bloque propio en
# series_disponibles.yaml (ese archivo manda cuando una variable está en ambos).
# Lo usa series_derivadas.info_variable() como respaldo, para que ninguna
# pantalla muestre el código crudo (n_bateria, n_pt101, ...) como si fuera un
# nombre.
#
# Fuentes, de más a menos fuerte:
#   [catálogo]  Catálogo oficial de variables convencionales de SIGMA
#               (variables-instrumento-convencionales.xlsx: instrumento,
#               nombre y frecuencia). No trae unidades: las unidades de las
#               convencionales son las habituales de cada instrumento.
#   [datos]     Verificado con datos descargados (rango de valores y relación
#               con su variable hermana), 2026-10-09.
#   [patrón]    Mismo patrón de nombre que una variable hermana ya rotulada
#               (ej. n_maxath = máx. horaria de n_airtemp ⇒ n_maxpresatmh =
#               máx. horaria de n_presatm). Familia de sensor según el
#               diccionario de sensores de SIGMA.
#   Cuando el significado exacto no es seguro se muestra la familia física
#   junto al código, ej. "Temperatura del aire (n_airtemp_10m)".
# ─────────────────────────────────────────────────────────────────────────────

