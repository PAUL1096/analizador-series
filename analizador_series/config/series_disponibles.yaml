# ─────────────────────────────────────────────────────────────────────────────
# Series derivadas disponibles por variable
#
# IMPORTANTE: los CSVs de SIGMA son a 10 minutos para estaciones automáticas.
# Por eso los `lag` se expresan en pasos de 10 min:
#   lag=1  → 10 min     lag=6   → 1 hora      lag=36  → 6 horas
#   lag=72 → 12 horas   lag=144 → 24 horas
#
# El `label` aclara el sentido temporal al usuario.
#
# Tipos soportados:
#   delta, abs_delta, rolling_mean, rolling_std, z_local, tasa_cambio
# ─────────────────────────────────────────────────────────────────────────────

n_humedad:
  # NO llamar esto "(instantánea)": n_humedad_inst también llega a cadencia
  # horaria (verificado con datos reales, ver nota junto a n_airtemp más
  # abajo) — la vieja etiqueta hacía que ambas variables se vieran idénticas
  # en el selector, imposibilitando distinguirlas (reportado por el usuario
  # con la estación CHALACO/472FB328, donde ambas coexisten).
  display_name: "Humedad Relativa"
  unidad: "%"
  rango_fisico: [0, 100]
  series:
    - { id: dHR_10m,   tipo: delta,        lag: 1,    label: "Δ 10 min"  }
    - { id: dHR_1h,    tipo: delta,        lag: 6,    label: "Δ 1 hora"  }
    - { id: absdHR_1h, tipo: abs_delta,    lag: 6,    label: "|Δ| 1 hora" }
    - { id: dHR_3h,    tipo: delta,        lag: 18,   label: "Δ 3 horas" }
    - { id: dHR_6h,    tipo: delta,        lag: 36,   label: "Δ 6 horas" }
    - { id: dHR_12h,   tipo: delta,        lag: 72,   label: "Δ 12 horas" }
    - { id: dHR_24h,   tipo: delta,        lag: 144,  label: "Δ 24 horas" }
    - { id: stdHR_6h,  tipo: rolling_std,  ventana: 36, label: "Std móvil 6h" }
    - { id: stdHR_24h, tipo: rolling_std,  ventana: 144, label: "Std móvil 24h" }
    - { id: zHR_24h,   tipo: z_local,      ventana: 144, label: "Z-score local (24h)" }

n_humedad_inst:
  # Sufijo "_inst" es de SIGMA, no inventado acá — por eso SÍ se etiqueta
  # "(inst.)". Lo que no está confirmado es qué significa exactamente frente
  # a n_humedad (ver nota en n_airtemp_inst).
  display_name: "Humedad Relativa (inst.)"
  unidad: "%"
  rango_fisico: [0, 100]
  series:
    - { id: dHR_10m,   tipo: delta,        lag: 1,    label: "Δ 10 min"  }
    - { id: dHR_1h,    tipo: delta,        lag: 6,    label: "Δ 1 hora"  }
    - { id: absdHR_1h, tipo: abs_delta,    lag: 6,    label: "|Δ| 1 hora" }
    - { id: dHR_6h,    tipo: delta,        lag: 36,   label: "Δ 6 horas" }
    - { id: dHR_24h,   tipo: delta,        lag: 144,  label: "Δ 24 horas" }
    - { id: stdHR_24h, tipo: rolling_std,  ventana: 144, label: "Std móvil 24h" }
    - { id: zHR_24h,   tipo: z_local,      ventana: 144, label: "Z-score local 24h" }

n_maxrh:
  display_name: "HR máxima horaria"
  unidad: "%"
  rango_fisico: [0, 100]
  series:
    - { id: dmaxRH_1h, tipo: delta,        lag: 6,    label: "Δ horario" }
    - { id: stdmaxRH_24h, tipo: rolling_std, ventana: 144, label: "Std móvil 24h" }

n_minrh:
  display_name: "HR mínima horaria"
  unidad: "%"
  rango_fisico: [0, 100]
  series:
    - { id: dminRH_1h, tipo: delta,        lag: 6,    label: "Δ horario" }
    - { id: stdminRH_24h, tipo: rolling_std, ventana: 144, label: "Std móvil 24h" }

n_airtemp:
  # NO llamar esto "(instantánea)" — verificado con datos reales (472FB328
  # CHALACO, 103068, 104114) que n_airtemp Y n_airtemp_inst llegan a la
  # MISMA cadencia horaria; no es una distinción de frecuencia. La guía
  # original de la herramienta ya documentaba esto como abierto: "el significado preciso lo define el catálogo de variables —
  # confirmar con el equipo que mantiene el catálogo SIGMA". Lo único que
  # se pudo re-derivar acá: en 3 de las 4 estaciones probadas, n_airtemp es
  # más "suave" (std de Δ paso-a-paso menor) que n_airtemp_inst — consistente
  # con la hipótesis de que ESTA es la agregada/promedio y la otra la
  # lectura puntual, pero es una INFERENCIA, no una confirmación del
  # catálogo SIGMA.
  display_name: "Temperatura del Aire"
  unidad: "°C"
  rango_fisico: [-30, 50]
  series:
    - { id: dT_10m,    tipo: delta,        lag: 1,    label: "Δ 10 min" }
    - { id: dT_1h,     tipo: delta,        lag: 6,    label: "Δ 1 hora" }
    - { id: absdT_1h,  tipo: abs_delta,    lag: 6,    label: "|Δ| 1 hora" }
    - { id: dT_3h,     tipo: delta,        lag: 18,   label: "Δ 3 horas" }
    - { id: dT_6h,     tipo: delta,        lag: 36,   label: "Δ 6 horas" }
    - { id: dT_12h,    tipo: delta,        lag: 72,   label: "Δ 12 horas" }
    - { id: dT_24h,    tipo: delta,        lag: 144,  label: "Δ 24 horas" }
    - { id: stdT_24h,  tipo: rolling_std,  ventana: 144, label: "Std móvil 24h" }
    - { id: zT_24h,    tipo: z_local,      ventana: 144, label: "Z-score local 24h" }

n_airtemp_inst:
  # Sufijo "_inst" es de SIGMA, no inventado acá. Ver nota completa arriba
  # en n_airtemp — misma cadencia horaria, definición exacta sin confirmar.
  display_name: "Temperatura del Aire (inst.)"
  unidad: "°C"
  rango_fisico: [-30, 50]
  series:
    - { id: dT_1h,     tipo: delta,        lag: 6,    label: "Δ 1 hora" }
    - { id: absdT_1h,  tipo: abs_delta,    lag: 6,    label: "|Δ| 1 hora" }
    - { id: dT_6h,     tipo: delta,        lag: 36,   label: "Δ 6 horas" }
    - { id: dT_24h,    tipo: delta,        lag: 144,  label: "Δ 24 horas" }
    - { id: stdT_24h,  tipo: rolling_std,  ventana: 144, label: "Std móvil 24h" }
    - { id: zT_24h,    tipo: z_local,      ventana: 144, label: "Z-score local 24h" }

# n_maxat/n_minat (DIARIA) vs n_maxath/n_minath (HORARIA) — magnitud distinta,
# confirmado contra datos reales (misma nota que ya existía en consistencia.py
# junto a PRESETS). Antes de esto caían en el catch-all "_default" con
# display_name "Variable", indistinguibles entre sí en el selector.
n_maxat:
  display_name: "Temperatura Máxima diaria"
  unidad: "°C"
  rango_fisico: [-30, 50]
  series:
    - { id: dTmax_24h, tipo: delta, lag: 144, label: "Δ 24 horas" }

n_minat:
  display_name: "Temperatura Mínima diaria"
  unidad: "°C"
  rango_fisico: [-30, 50]
  series:
    - { id: dTmin_24h, tipo: delta, lag: 144, label: "Δ 24 horas" }

n_maxath:
  display_name: "Temperatura Máxima horaria"
  unidad: "°C"
  rango_fisico: [-30, 50]
  series:
    - { id: dTmaxh_1h, tipo: delta, lag: 6, label: "Δ horario" }
    - { id: stdTmaxh_24h, tipo: rolling_std, ventana: 144, label: "Std móvil 24h" }

n_minath:
  display_name: "Temperatura Mínima horaria"
  unidad: "°C"
  rango_fisico: [-30, 50]
  series:
    - { id: dTminh_1h, tipo: delta, lag: 6, label: "Δ horario" }
    - { id: stdTminh_24h, tipo: rolling_std, ventana: 144, label: "Std móvil 24h" }

