    - { id: dP_3h,    tipo: delta,        lag: 18,   label: "Δ 3 horas (tendencia)" }
    - { id: dP_12h,   tipo: delta,        lag: 72,   label: "Δ 12 horas" }
    - { id: stdP_24h, tipo: rolling_std,  ventana: 144, label: "Std móvil 24h" }

n_presatm_inst:
  # Sufijo "_inst" es de SIGMA — ver nota en n_airtemp sobre por qué no se
  # etiqueta n_presatm como "(instantánea)" tampoco acá.
  display_name: "Presión Atmosférica (inst.)"
  unidad: "hPa"
  rango_fisico: [500, 1100]
  series:
    - { id: dP_1h,    tipo: delta,        lag: 6,    label: "Δ 1 hora" }
    - { id: dP_3h,    tipo: delta,        lag: 18,   label: "Δ 3 horas" }
    - { id: stdP_24h, tipo: rolling_std,  ventana: 144, label: "Std móvil 24h" }

n_velviento:
  display_name: "Velocidad del Viento"
  unidad: "m/s"
  rango_fisico: [0, 75]
  series:
    - { id: dV_1h,    tipo: delta,        lag: 6,    label: "Δ 1 hora" }
    - { id: absdV_1h, tipo: abs_delta,    lag: 6,    label: "|Δ| 1 hora" }
    - { id: stdV_24h, tipo: rolling_std,  ventana: 144, label: "Std móvil 24h" }

n_dirviento:
  display_name: "Dirección del Viento"
