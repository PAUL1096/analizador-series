# Catch-all para variables no listadas (asume 10-min)
_default:
  display_name: "Variable"
  unidad: ""
  rango_fisico: [null, null]
  series:
    - { id: dv_10m,    tipo: delta,       lag: 1,    label: "Δ 10 min" }
    - { id: dv_1h,     tipo: delta,       lag: 6,    label: "Δ 1 hora" }
    - { id: absdv_1h,  tipo: abs_delta,   lag: 6,    label: "|Δ| 1 hora" }
    - { id: std_24h,   tipo: rolling_std, ventana: 144, label: "Std móvil 24h" }
